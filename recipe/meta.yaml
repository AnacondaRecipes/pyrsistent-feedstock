{% set version = "0.19.3" %}

package:
  name: pyrsistent
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/p/pyrsistent/pyrsistent-{{ version }}.tar.gz
  sha256: 1a2994773706bbb4995c31a97bc94f1418314923bd1048c6d964837040376440

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - {{ compiler('c') }}
  host:
    - python
    - pytest-runner
    - pip
    - setuptools
    - wheel
  run:
    - python

test:
  imports:
    - pyrsistent
  commands:
    - pip check
  requires:
    - pip

about:
  home: http://github.com/tobgu/pyrsistent/
  license: MIT
  license_family: MIT
  license_file: LICENSE.mit
  summary: Persistent/Functional/Immutable data structures
  dev_url: http://github.com/tobgu/pyrsistent/
  doc_url: https://github.com/tobgu/pyrsistent/blob/master/README.rst

extra:
  recipe-maintainers:
    - ocefpaf
